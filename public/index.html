<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vroomdle - Racing Game</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <script type="importmap">
      {
        "imports": {
          "@discord/embedded-app-sdk": "/.proxy/jsdelivr/npm/@discord/embedded-app-sdk@1.2.0/+esm"
        }
      }
    </script>
  </head>
  <body>
    <div class="page-container">
      <div class="topBar">
        <div class="leftInfo">
          <img src="./icon.svg" />
          <div class="vertContainerText">
            <input type="text" id="usernameField" placeholder="Guest" />
            <p id="isVrooming">&nbsp;is Vrooming...</p>
          </div>
        </div>
        <div class="header">
          <h1 class="title">VROOMDLE</h1>
          <p class="subtitle">Vroom Vroom</p>
        </div>
        <div></div>
      </div>

      <!-- Main Game Area -->
      <div class="main-game-area">
        <!-- Center: Game Canvas -->
        <div class="center-game">
          <div class="leftButtonHolder">
            <button class="controlButton" id="w"></button>
            <button class="controlButton" id="s"></button>
          </div>
          <div class="game-container">
            <canvas id="gameCanvas" width="800" height="600"></canvas>

            <div id="menuOverlay" class="overlay">
              <div class="overlay-content">
                <h2 class="overlay-title">How to Play</h2>
                <div class="controls">
                  <p><strong>W</strong> - Accelerate</p>
                  <p><strong>S</strong> - Brake / Reverse</p>
                  <p><strong>A / J</strong> - Turn Left</p>
                  <p><strong>D / L</strong> - Turn Right</p>
                  <p><strong>R</strong> - Reset</p>
                </div>
                <p id="bestTimeDisplay" class="best-time"></p>
                <button id="startButton" class="btn">Start Race</button>
              </div>
            </div>

            <div id="winOverlay" class="overlay hidden">
              <div class="overlay-content">
                <h2 class="win-title">Finish!</h2>
                <p id="finalTime" class="final-time"></p>
                <p id="newBestTime" class="new-best hidden">
                  New Best Time! 🏆
                </p>
                <button id="restartButton" class="btn">Race Again</button>
              </div>
            </div>
            <!-- Leaderboard (slides behind canvas from right) -->
            <div id="leaderboardPanel" class="leaderboard-panel">
            <div class="leaderboard-content">
              <h3 class="leaderboard-title">Top 10</h3>
              <div id="leaderboardList" class="leaderboard-list">
                <div class="leaderboard-item">
                  <span class="rank">1</span>
                  <span class="player-name" id="player1"></span>
                  <span class="player-time" id="time1"></span>
                </div>
                <div class="leaderboard-item">
                  <span class="rank">2</span>
                  <span class="player-name" id="player2"></span>
                  <span class="player-time" id="time2"></span>
                </div>
                <div class="leaderboard-item">
                  <span class="rank">3</span>
                  <span class="player-name" id="player3"></span>
                  <span class="player-time" id="time3"></span>
                </div>
                <div class="leaderboard-item">
                  <span class="rank">4</span>
                  <span class="player-name" id="player4"></span>
                  <span class="player-time" id="time4"></span>
                </div>
                <div class="leaderboard-item">
                  <span class="rank">5</span>
                  <span class="player-name" id="player5"></span>
                  <span class="player-time" id="time5"></span>
                </div>
                <div class="leaderboard-item">
                  <span class="rank">6</span>
                  <span class="player-name" id="player6"></span>
                  <span class="player-time" id="time6"></span>
                </div>
                <div class="leaderboard-item">
                  <span class="rank">7</span>
                  <span class="player-name" id="player7"></span>
                  <span class="player-time" id="time7"></span>
                </div>
                <div class="leaderboard-item">
                  <span class="rank">8</span>
                  <span class="player-name" id="player8"></span>
                  <span class="player-time" id="time8"></span>
                </div>
                <div class="leaderboard-item">
                  <span class="rank">9</span>
                  <span class="player-name" id="player9"></span>
                  <span class="player-time" id="time9"></span>
                </div>
                <div class="leaderboard-item">
                  <span class="rank">10</span>
                  <span class="player-name" id="player10"></span>
                  <span class="player-time" id="time10"></span>
                </div>
              </div>
            </div>
            <button
              id="leaderboardToggle"
              class="leaderboard-toggle"
              title="Toggle Leaderboard"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="currentColor"
              >
                <path d="M4 8l4-4 4 4" />
              </svg>
            </button>
          </div>
          </div>
          <div class="rightButtonHolder">
            <button class="controlButton" id="a"></button>
            <button class="controlButton" id="d"></button>
          </div>
        </div>
      </div>

      <!-- Bottom Controls -->
      <div class="bottom-controls">
        <button id="dailyButton" class="btn">Daily Track</button>
        <button id="timerResetButton" class="timer-box">
          <span id="currentTime" class="timer">0.00s</span>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="2"
            class="retrySymbol"
          >
            <path
              d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"
            />
          </svg>
        </button>
        <button id="freeplayButton" class="btn">Free Play</button>
      </div>
    </div>

    <script src="game.js" type="module"></script>
  </body>
</html>
